<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>درب زبيدة | رحلة عبر الزمن</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#080706;
    color:#f5eee3;
    font-family:'Cairo',sans-serif;
    overflow-x:hidden;
}

/* =========================
   GLOBAL
========================= */

:root{
    --gold:#d6ad62;
    --gold-light:#f0d49b;
    --sand:#b99665;
    --dark:#080706;
    --dark2:#12100d;
    --cream:#f5eee3;
}

section{
    position:relative;
    min-height:100vh;
    overflow:hidden;
}

.container{
    width:min(1200px,90%);
    margin:auto;
    position:relative;
    z-index:5;
}

.gold{
    color:var(--gold-light);
}

.small-title{
    color:var(--gold);
    letter-spacing:4px;
    font-size:13px;
    margin-bottom:18px;
}

/* =========================
   INTRO
========================= */

#intro{
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:
        radial-gradient(circle at 50% 40%,rgba(214,173,98,.13),transparent 35%),
        linear-gradient(180deg,#050403,#100d09 70%,#050403);
}

#intro::before{
    content:"";
    position:absolute;
    inset:-20%;
    background:
        radial-gradient(circle,rgba(255,220,160,.08) 1px,transparent 2px);
    background-size:90px 90px;
    animation:stars 25s linear infinite;
}

@keyframes stars{
    from{transform:translateY(0)}
    to{transform:translateY(-180px)}
}

.intro-content{
    animation:introIn 2s ease forwards;
    opacity:0;
    transform:translateY(40px);
}

@keyframes introIn{
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.eyebrow{
    font-size:15px;
    letter-spacing:5px;
    color:var(--gold);
    margin-bottom:25px;
}

.main-title{
    font-family:'Playfair Display','Cairo',serif;
    font-size:clamp(55px,10vw,125px);
    line-height:1;
    font-weight:700;
    text-shadow:0 0 50px rgba(214,173,98,.15);
}
