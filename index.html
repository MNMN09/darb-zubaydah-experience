 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>درب زبيدة | رحلة عبر الزمن</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #11100d;
      color: #f5efe5;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
      background:
        radial-gradient(circle at center, #4b3927 0%, #201a14 45%, #11100d 100%);
    }

    .hero-content {
      max-width: 900px;
    }

    .eyebrow {
      letter-spacing: 4px;
      font-size: 14px;
      opacity: 0.7;
      margin-bottom: 24px;
    }

    h1 {
      font-size: clamp(48px, 9vw, 110px);
      line-height: 0.95;
      margin-bottom: 28px;
    }

    .subtitle {
      font-size: clamp(18px, 2.5vw, 28px);
      line-height: 1.7;
      opacity: 0.85;
    }

    .scroll {
      margin-top: 60px;
      font-size: 14px;
      opacity: 0.6;
    }
  </style>
</head>

<body>

  <main class="hero">
    <div class="hero-content">

      <div class="eyebrow">
        رحلة عبر الزمن
      </div>

      <h1>
        درب زبيدة
      </h1>

      <p class="subtitle">
        طريقٌ تاريخي صنعته القوافل،
        وحفظت محطاته قصة الماء والسفر والحضارة.
      </p>

      <div class="scroll">
<button onclick="startJourney()">↓ ابدأ الرحلة</button>      </div>

    </div>
  </main>
<script>
function startJourney() {
  document.body.style.transition = "opacity 1s ease";
  document.body.style.opacity = "0";

  setTimeout(() => {
    document.body.style.opacity = "1";
    alert("رحلتنا عبر درب زبيدة تبدأ الآن ✨");
  }, 1000);
}
</script>
</body>
</html>
